server {
    listen 80;
    server_name 10.10.190.11 novatech.test;
    root /var/www/novatech/public;
    index index.php;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / { try_files $uri /index.php?$query_string; }
    location ~ /\. { deny all; }
    location ~* ^/(src|templates|db|deploy|tools|tests)(/|$) { deny all; }
    location ~* \.(sql|md|ini|log|bak|docx)$ { deny all; }
    location = /router.php { deny all; }
    # Chỉ front controller được thực thi, không thực thi PHP tùy ý.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { deny all; }
    access_log /var/log/nginx/novatech-access.log;
    error_log /var/log/nginx/novatech-error.log;
}
